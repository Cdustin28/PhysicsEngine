[package]
name = "engine"
description = "Core 2D physics: rigid bodies and (soon) SPH fluids. No graphics or GUI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
materials = { path = "../materials" }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false

[features]
# Multithreaded fluid on desktop. Off by default, so the web build and
# `cargo test -p engine` stay single-threaded and fully deterministic.
parallel = ["dep:rayon"]

[lints]
workspace = true
