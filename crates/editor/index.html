<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>PhysicsEngine</title>
  <!-- Trunk compiles the `physicsengine` binary to WebAssembly and injects it here. -->
  <link data-trunk rel="rust" data-bin="physicsengine" data-wasm-opt="2" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f7f5; }
    #the_canvas_id { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #loading_text {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: system-ui, sans-serif; color: #444; text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="the_canvas_id"></canvas>
  <div id="loading_text">Loading simulator…</div>
</body>
</html>
