[package]
name = "editor"
description = "Interactive editor for physicsengine.dev: place, drag, simulate, save and load scenes."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "physicsengine"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
# `persistence` remembers settings and the last scene between sessions.
eframe = { version = "0.37", features = ["persistence"] }
glam.workspace = true
serde.workspace = true
# File dialogs: native OS dialogs on desktop, the browser's picker on the web.
rfd = "0.17"

# Desktop: multithreaded fluid.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
engine = { path = "../engine", features = ["parallel"] }

# Web-only: async entry point for the browser build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Url",
    "Window",
] }

[lints]
workspace = true
